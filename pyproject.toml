[project]
name = "object-detector"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "**/.*",
    "**/__pycache__",
    ".venv",
    "compiler_generated",
    "typings",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = [
    "(?:^|/)\\.[^/]+(?:/|$)",
    "__pycache__",
    ".venv",
    "^typings/",
    "^compiler_generated/",
]
