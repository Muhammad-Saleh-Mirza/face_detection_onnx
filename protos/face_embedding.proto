syntax = "proto3";

package face_embedding;

// =====================================================
// FACE EMBEDDING GENERATION SERVICE (REMOTE)
// =====================================================
service FaceEmbeddingService {

  // Generate 512-dimensional embedding for an aligned 112x112 face crop
  rpc Forward (DetectionRequest) returns (DetectionResponse);
}

// =====================================================
// EMBEDDING REQUEST
// =====================================================
message DetectionRequest {

  // Aligned 112x112 face crop (JPEG compressed, quality 99)
  bytes image_data = 1;
}

// =====================================================
// EMBEDDING RESPONSE
// =====================================================
message DetectionResponse {

  // 512-dimensional face embedding vector (normalized)
  repeated float embedding = 1;
}
